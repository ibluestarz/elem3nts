# CI ELEM3NTS (PFC-022, D48) : gates dans l'ordre imposé (docs/TESTING.md), arrêt au premier échec ; déploiement
# staging uniquement à la demande (Actions → CI → Run workflow → deploy_staging), jamais à chaque modification,
# et jamais sans un job `verify` vert. La production n'est jamais publiée par cette CI (PFC-023).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Publier sur staging l'artefact vérifié par ce run, puis lancer le smoke deux joueurs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une PR mise à jour annule son run précédent ; un run de main ou un déploiement va toujours au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Gates (build → fonctionnel → ESLint → Playwright)
    # Même distribution que le poste qui capture les références visuelles de la maquette (Ubuntu 22.04) : la parité
    # est au pixel près (D28) et le rendu des polices change avec FreeType (24.04 : 22 écrans à ~1 % de pixels).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: true
      # L'artefact vérifié est le candidat staging : l'environnement wrangler se choisit au build (D48).
      CLOUDFLARE_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Navigateurs Playwright (cache par version du lockfile)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      # Mêmes étapes et même ordre que `npm run verify` (vérifié par tests/tooling/ci.test.ts).
      - run: npm run build
      - run: npm run test:functional
      - run: npm run lint
      # Écran virtuel : sans serveur d'affichage, Firefox headless n'a pas de WebGL2 et journalise un avertissement que
      # la recette compte comme un problème (32 échecs au run 36650584121). Le poste de référence (WSLg) en a un.
      - run: xvfb-run -a npm run test:e2e
      - name: Liste publique des échecs Playwright (échec seulement)
        if: failure()
        run: node scripts/ci-failures.ts test-results/results.json
      - name: Artefact vérifié (dist/)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-staging
          path: dist/
          # `dist/client/.assetsignore` tient la configuration du Worker hors des fichiers publics.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Rapport Playwright (échec seulement)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    name: Déploiement staging et smoke
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://elem3nts-staging.bluestarz.workers.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Artefact vérifié par le job verify (aucun rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-staging
          path: dist/
      - name: Publication staging
        run: npm run deploy:staging
        # Seule étape qui reçoit les secrets ; wrangler les lit lui-même, rien ne les affiche.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke deux joueurs sur staging
        run: npm run test:smoke
        env:
          SMOKE_URL: https://elem3nts-staging.bluestarz.workers.dev
      - name: Rapport du smoke (échec seulement)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report
          path: |
            playwright-report/smoke/
            test-results/smoke/
          if-no-files-found: ignore
          retention-days: 7
